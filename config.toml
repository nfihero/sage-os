# Sage OS hub configuration. Relative paths are relative to the sage-os folder.

[hub]
host = "127.0.0.1"          # never 0.0.0.0 -- remote access goes through Tailscale Serve (Phase 3)
port = 8787
# remote_hosts = []         # Phase 3: exact tailnet name(s), e.g. "sage-pc.tail1234.ts.net"; never wildcards (D14)
keep_events = 5000          # persisted events kept for catch-up

# Where Sage OS keeps things (DECISIONS D25). App data is per computer and never synced: databases, indexes,
# copies of your sources, models, sign-ins. The Library is what moves between your devices: Notes/ (your
# markdown notes, which agents search) and Files/ (any documents you drop in). Point the Library at a folder
# your sync service already syncs (OneDrive, iCloud Drive, Dropbox, Syncthing), from Bookshelf -> STORAGE.
# Per computer, so set these in config.local.toml, not here.
# [storage]
# data = "C:/Users/you/AppData/Roaming/Sage OS"       # default: the OS's app-data folder
# library = "C:/Users/you/OneDrive/Sage Library"      # default: <data>/Library

[hermes]
# home = "C:/Users/you/AppData/Local/hermes"   # default: %LOCALAPPDATA%\hermes (~/.hermes elsewhere)
gateway = "http://127.0.0.1:8642"
router = "http://127.0.0.1:18434"
sidecar = "http://127.0.0.1:18435"

[poll]                      # seconds
board = 5
gpu = 3
health = 5                  # every check is an access-log line in Hermes' agent.log
safety = 1
sessions = 30

[agents]                    # connectors (DECISIONS D4): agents plug in, none is required
# A fresh install connects nothing (D39): the user connects what they have from the chat space's first screen,
# which saves it in their own config.local.toml. Examples:
# claude = true             # Claude Code via the Agent SDK
# hermes = ["default"]      # Hermes profiles to connect
# lead = "claude"           # answers team chat by default (D8; used from Phase 6)

# Extra OpenAI-compatible model servers (the Hermes llama.cpp router is added automatically while
# Hermes is connected). Keys come from an environment variable named by api_key_env, never this file.
# [[models]]
# id = "ollama"
# label = "Ollama"
# base_url = "http://127.0.0.1:11434/v1"
# kind = "local"            # local | cloud
# api_key_env = "OLLAMA_API_KEY"
#
# ChatGPT and Gemini (D22.2): set the key in an environment variable, then uncomment.
# [[models]]
# id = "openai"
# label = "ChatGPT (OpenAI)"
# base_url = "https://api.openai.com/v1"
# kind = "cloud"
# api_key_env = "OPENAI_API_KEY"
# [[models]]
# id = "gemini"
# label = "Gemini (Google)"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# kind = "cloud"
# api_key_env = "GEMINI_API_KEY"

[engine]                    # Sage OS's own llama-server (D22.3); models and binaries live in data/engine
port = 8790
# A machine that already has llama.cpp or GGUF files can use them instead of downloading; put these in
# config.local.toml, since the paths differ per machine (D21):
# binary = "C:/path/to/llama-server.exe"
# model_dirs = ["C:/path/to/models"]

# [bookshelf] paths default from [storage] (D25): the notes are <library>/Notes; in app data, the search
# index bookshelf-index.db (a cache, safe to delete, D10) and the journal bookshelf.db (proposals + undo
# history, D11: not a cache; it holds a secret only if you chose "Save anyway" on a held proposal, D12).
# [bookshelf]
# vault = "..."  index = "..."  journal = "..."

# Source library (DECISIONS D15): read-only copies of chosen folders, kept in data/sources/<name>,
# text indexed for search by you and agents. The original is only ever read. Files that look private
# by name or content are never copied (they're listed in Bookshelf -> Sources).
# [[sources]]
# name = "drive"
# path = "G:/"                              # e.g. Google Drive for desktop
# include = ["My Drive/Coursework", "My Drive/Work"]
# exclude = ["My Drive/Private"]             # never copied
# google = true                              # Google Docs/Sheets/Slides through the Drive API once connected (D22)
# notes_folder = "Drive"                     # starter notes from this source go under Drive/ in the vault (K6)
# strip = ["My Drive"]                       # dropped from vault paths
#
# A Drive folder read straight through the Drive API (no Drive for desktop needed; D22.5):
# [[sources]]
# name = "gdrive"
# path = "My Drive"
# api = true
# include = ["Coursework"]
# Your own sources go in config.local.toml (per computer, untracked).

[claude]
# Folders a Claude session may start in (first is the default). Claude still asks before
# running commands or editing files; answers come from the Sage OS inbox. Set yours in config.local.toml:
# workspaces = ["C:/Users/you/projects"]

[ui]
pinned_profiles = ["default"]
hidden_profiles = ["sage"]             # retired 30 Sep 2026 (archived); hidden until Hermes deletes it
profile_labels = { default = "Hermes" }  # shown in the UI; Hermes' own profile id stays "default"
safety_feed_size = 200
