# Sage OS hub configuration. Relative paths are relative to the sage-os folder.

[hub]
host = "127.0.0.1"          # never 0.0.0.0 -- remote access goes through Tailscale Serve (Phase 3)
port = 8787
# remote_hosts = []         # Phase 3: exact tailnet name(s), e.g. "sage-pc.tail1234.ts.net"; never wildcards (D14)
store = "data/hub.db"       # relative to the sage-os folder
keep_events = 5000          # persisted events kept for catch-up

[hermes]
home = "C:/Users/you/AppData/Local/hermes"
gateway = "http://127.0.0.1:8642"
router = "http://127.0.0.1:18434"
sidecar = "http://127.0.0.1:18435"

[poll]                      # seconds
board = 5
gpu = 3
health = 5                  # every check is an access-log line in Hermes' agent.log
safety = 1
sessions = 30

[agents]                    # connectors (DECISIONS D4): agents plug in, none is required
lead = "claude"             # answers team chat by default (D8; used from Phase 6)
claude = true               # Claude Code via the Agent SDK
hermes = ["default"]        # Hermes profiles to connect; [] runs Sage OS without Hermes chat

# Extra OpenAI-compatible model servers (the Hermes llama.cpp router is added automatically while
# Hermes is connected). Keys come from an environment variable named by api_key_env, never this file.
# [[models]]
# id = "ollama"
# label = "Ollama"
# base_url = "http://127.0.0.1:11434/v1"
# kind = "local"            # local | cloud
# api_key_env = "OLLAMA_API_KEY"
#
# ChatGPT and Gemini (D22.2): set the key in an environment variable, then uncomment.
# [[models]]
# id = "openai"
# label = "ChatGPT (OpenAI)"
# base_url = "https://api.openai.com/v1"
# kind = "cloud"
# api_key_env = "OPENAI_API_KEY"
# [[models]]
# id = "gemini"
# label = "Gemini (Google)"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# kind = "cloud"
# api_key_env = "GEMINI_API_KEY"

[engine]                    # Sage OS's own llama-server (D22.3); models and binaries live in data/engine
port = 8790
# This PC already has a CUDA build and models from Hermes: use them instead of downloading. A fresh
# install leaves these out and downloads the build and models from the Models screen.
binary = "C:/Users/you/AppData/Local/hermes/tools/llamacpp-cuda-10964-win32-x64/llama-server.exe"
model_dirs = ["C:/Users/you/AppData/Local/hermes/models"]

[bookshelf]
vault = "data/vault"        # the knowledge base (DECISIONS D6); relative to the sage-os folder
index = "data/bookshelf-index.db"   # search index: a cache, safe to delete (D10)
journal = "data/bookshelf.db"       # proposals + undo history (D11): not a cache; deleting it loses undo.
                                    # Holds a secret only if you chose "Save anyway" on a held proposal (D12).

# Source library (DECISIONS D15): read-only copies of chosen folders, kept in data/sources/<name>,
# text indexed for search by you and agents. The original is only ever read. Files that look private
# by name or content are never copied (they're listed in Bookshelf -> Sources).
[[sources]]
name = "drive"
path = "G:/"
include = [
  "My Drive/Archive/Finance Classes",
  "My Drive/Deal Club",
  "My Drive/Investing Course",
  "My Drive/Accounting Project",
  "My Drive/Colab Notebooks",
  "My Drive/Resume CV",
  "Other computers/My MacBook Air",
]
exclude = [
  "My Drive/Private",                                # card statements: private (user, 1 Oct)
  "My Drive/Archive/Photos",                       # photos: no text (user, 1 Oct)
  "Other computers/My MacBook Air/Downloads/7z2409-mac",   # a downloaded app's manual
  "Other computers/My MacBook Air/Documents/Card statements",   # card statements named by date: private (2 Oct)
  # other people's contact details: kept out of the knowledge base (user, 6 Oct)
  "My Drive/Deal Club/contacts/Contact list.xlsx",
]
google = true                              # Google Docs/Sheets/Slides come through the Drive API once connected (D22)
notes_folder = "Drive"                     # starter notes from this source go under Drive/ in the vault (K6)
strip = ["My Drive", "Other computers"]    # dropped from vault paths: Drive/Archive/... not Drive/My Drive/Archive/...

[claude]
# Folders a Claude session may start in (first is the default). Claude still asks before
# running commands or editing files; answers come from the Sage OS inbox.
workspaces = [
  "C:/Users/you/hermes-workspace",
  "C:/Users/you/hermes-workspace/budget-tracker",
  "C:/Users/you/sage-os",
  "C:/Users/you/claude-workspace",
]

[ui]
pinned_profiles = ["default"]
hidden_profiles = ["sage"]             # retired 30 Sep 2026 (archived); hidden until Hermes deletes it
profile_labels = { default = "Hermes" }  # shown in the UI; Hermes' own profile id stays "default"
safety_feed_size = 200
