[project]
name = "sage-os-hub"
version = "0.24.0"
description = "Sage OS hub: one event stream over Hermes, Claude Code and the local GPU (Phase 1: read-only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "psutil>=6",
    "claude-agent-sdk>=0.2",
    "pyyaml>=6",
    "pypdf>=5",
    "numpy>=2",                 # meaning-based search (K14)
    "keyring>=25",              # API keys in the OS keychain (D40)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sage_os_hub*"]

[tool.setuptools.package-data]
sage_os_hub = ["engine/catalog.json", "pricing.json"]   # data files ship with the package (and the desktop app's bundle)

[tool.pytest.ini_options]
testpaths = ["tests"]
