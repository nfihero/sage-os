[project]
name = "sage-os-hub"
version = "0.14.0"
description = "Sage OS hub: one event stream over Hermes, Claude Code and the local GPU (Phase 1: read-only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "psutil>=6",
    "claude-agent-sdk>=0.2",
    "pyyaml>=6",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sage_os_hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
